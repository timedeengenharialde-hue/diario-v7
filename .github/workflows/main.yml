name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos na raiz
        run: |
          for f in package.json capacitor.config.json www/index.html nativo/instalar.js; do
            if [ ! -f "$f" ]; then echo "::error::Falta $f na RAIZ do repositório. Suba o conteúdo do zip, não a pasta."; exit 1; fi
          done
      - name: Carimbar data do build
        run: |
          D=$(TZ=America/Recife date '+%d/%m %H:%M')
          echo "window.BUILD='$D';" > www/build.js
          sed -i "s|id=\"bstamp\">local<|id=\"bstamp\">$D<|" www/index.html
          grep -o 'id="bstamp">[^<]*' www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: diario-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
