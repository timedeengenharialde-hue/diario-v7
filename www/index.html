<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Sintomas</title>
<style>
:root{--bg:#1c1c1b;--card:#e9e9e6;--ink:#1d1d1b;--mute:#62625e;--line:#d0d0cb;--pri:#1b8f4c;--pri2:#d6f0df;--warn:#b86e00;--red:#c9302a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:15px}
body{padding:max(env(safe-area-inset-top),24px) 0 calc(64px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:520px;margin:0 auto;padding:8px 14px}
h1{font-size:18px;margin:4px 0 10px;color:#f1f1ee}
h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.top{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;position:relative;height:118px;margin-bottom:6px}
.pillbox{margin-right:auto;margin-bottom:8px;display:grid;gap:4px}
.pillbox span{background:var(--card);border-radius:14px;padding:4px 10px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pillbox b{color:var(--pri)}
.cat{width:148px;height:112px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.cat svg,.cat img{width:100%;height:100%;display:block;object-fit:contain}
.bubble{position:absolute;right:140px;top:2px;max-width:215px;background:#fff;border-radius:10px 10px 2px 10px;padding:7px 10px;font-size:13px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.meds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.med{border-radius:8px;padding:10px;background:#f4f4f1}
.med b{display:block}
.med small{color:var(--mute);display:block;margin:2px 0 8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--pri2);color:var(--pri);font-weight:600}
.btn.pri{background:var(--pri);color:#fff}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--mute);font-weight:500}
.btn.del{background:transparent;color:var(--red);padding:4px 8px;font-weight:500}
.grp{margin-bottom:10px}
.grp h3{font-size:12.5px;color:var(--mute);font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.sel{display:grid;gap:8px;margin:10px 0}
.selrow{display:flex;align-items:center;gap:8px}
.selrow span{flex:1;font-weight:600}
.lv{display:flex;gap:4px}
.lv button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff}
.lv button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-top:8px}
input[type=text],input[type=datetime-local],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;font-size:15px;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.note{font-size:12.5px;color:var(--mute);line-height:1.4}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 4px;color:var(--mute);font-size:13px}
nav button.on{color:var(--pri);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px}
.seg button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600;font-size:12px}
td.n{text-align:right;white-space:nowrap}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.entry .b{margin-top:3px;line-height:1.4}
.tag{display:inline-block;font-size:12px;background:var(--pri2);color:var(--pri);border-radius:6px;padding:1px 6px;margin-left:4px}
.tag.med{background:#f6ecdf;color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet .in{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 .btn{flex:1}
</style>
</head>
<body>
<main><div class="top"><div class="bubble" id="bubble"></div><div class="pillbox" id="pills"></div><div class="cat" id="cat"></div></div><div id="err"></div><div id="main"><div class="card">Carregando… (versão 7)</div></div></main>
<nav>
  <button data-tab="hoje" class="on">Registrar</button>
  <button data-tab="rel">Relatório</button>
  <button data-tab="hist">Histórico</button>
  <span style="position:absolute;right:6px;bottom:2px;font-size:9px;color:#9a9a96">v7 · <span id="bstamp">local</span></span>
</nav>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Roda antes de tudo: mostra erros na tela (inclusive de sintaxe) e completa funções que faltam em Android antigo */
window.onerror = function (m, f, l) {
  var el = document.getElementById('err');
  if (el) el.innerHTML += '<div class="card">Erro ao abrir: ' + m + ' (linha ' + l + ')<br><small>' + navigator.userAgent + '</small><br>Mande um print disso.</div>';
};
if (!Object.fromEntries) Object.fromEntries = function (a) { var o = {}; Array.from(a).forEach(function (p) { o[p[0]] = p[1]; }); return o; };
if (!Array.prototype.flatMap) Array.prototype.flatMap = function (f) { return [].concat.apply([], this.map(f)); };
if (!Array.prototype.flat) Array.prototype.flat = function () { return [].concat.apply([], this); };
</script>
<script src="build.js"></script>
<script>
const KEY = "diario-sintomas.v1";
const CAPN = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const H = 36e5, D = 864e5;
const GRUPOS = [
  ["Bem", [["tranquilo", "Tranquilo"], ["focado", "Focado"], ["disposto", "Disposto"]]],
  ["Energia", [["sonolencia", "Sonol\xEAncia"], ["cansaco", "Cansa\xE7o"], ["agitacao", "Agita\xE7\xE3o"], ["inquietacao", "Inquieta\xE7\xE3o"]]],
  ["Humor", [["irritacao", "Irrita\xE7\xE3o"], ["ansiedade", "Ansiedade"], ["tristeza", "Tristeza"], ["desanimo", "Des\xE2nimo"], ["choro", "Choro f\xE1cil"]]],
  ["Foco", [["distracao", "Distra\xE7\xE3o"], ["esquecimento", "Esquecimento"], ["procrastinacao", "Procrastina\xE7\xE3o"], ["hiperfoco", "Hiperfoco"]]],
  ["Corpo", [["apetite", "Falta de apetite"], ["insonia", "Ins\xF4nia"], ["cabeca", "Dor de cabe\xE7a"], ["coracao", "Cora\xE7\xE3o acelerado"], ["nausea", "N\xE1usea"]]],
  ["Social", [["naosair", "N\xE3o quis sair"], ["evitar", "Evitei pessoas"]]]
];
const NOME = Object.fromEntries(GRUPOS.flatMap((g) => g[1]));
const MEDS = { rit: "Ritalina", esc: "Escitalopram" };
let S = load();
let tab = "hoje", pend = {}, periodo = 7;
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.entries) {
      s.lemb = s.lemb || { rit: [], esc: [] };
      return s;
    }
  } catch (e) {
  }
  return { entries: [], doses: [], lastDose: { rit: "", esc: "10 mg" }, lemb: { rit: [], esc: [] } };
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
  }
  syncWidget();
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (t) => new Date(t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const fmtD = (t) => new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });
const hs = (ms) => (ms / H).toFixed(1).replace(".", ",") + " h";
function toLocal(ms) {
  const d = new Date(ms - new Date(ms).getTimezoneOffset() * 6e4);
  return d.toISOString().slice(0, 16);
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}
function lastDoseBefore(med, t) {
  let best = null;
  for (const d of S.doses) if (d.med === med && d.t <= t && (!best || d.t > best.t)) best = d;
  return best;
}
function sinceTxt(med, t) {
  const d = lastDoseBefore(med, t);
  return d ? hs(t - d.t) : null;
}
function hojeHTML() {
  const t = Date.now();
  const med = (k) => {
    const d = lastDoseBefore(k, t);
    return '<div class="med"><b>'.concat(MEDS[k], "</b><small>").concat(d ? "\xDAltima: " + fmt(d.t) + " (h\xE1 " + hs(t - d.t) + ")" : "Nenhum registro", '</small>\n      <button class="btn full" data-dose="').concat(k, '">Tomei agora</button></div>');
  };
  const sel = Object.keys(pend);
  return '  <div class="card"><h2>Rem\xE9dios</h2><div class="meds">'.concat(med("rit")).concat(med("esc"), '</div>\n    <div class="row2"><button class="btn full" data-act="lembretes">\u23F0 Lembretes: ').concat(lembResumo(), '</button></div>\n    <div class="row2"><button class="btn full" data-act="flutuante">\u{1F431} Gato flutuante na tela: ').concat(S.flut ? "ligado" : "desligado", '</button></div>\n    <p class="note">Aqui s\xF3 se registra o que voc\xEA tomou. Mudan\xE7a de dose, s\xF3 com quem prescreve.</p></div>\n  <div class="card">\n    ').concat(GRUPOS.map(([g, it]) => '<div class="grp"><h3>'.concat(g, '</h3><div class="chips">').concat(it.map(([k, n]) => '<button class="chip '.concat(pend[k] ? "on" : "", '" data-chip="').concat(k, '">').concat(n, "</button>")).join(""), "</div></div>")).join(""), "\n    ").concat(sel.length ? '<div class="sel"><div class="note">Intensidade: 1 = leve, 5 = muito forte</div>'.concat(sel.map((k) => '<div class="selrow"><span>'.concat(NOME[k], '</span>\n      <div class="lv">').concat([1, 2, 3, 4, 5].map((n) => '<button class="'.concat(pend[k] === n ? "on" : "", '" data-lv="').concat(k, '" data-n="').concat(n, '">').concat(n, "</button>")).join(""), "</div></div>")).join(""), "</div>") : "", "\n    ").concat(pend.naosair ? '<label class="f">Por que n\xE3o quis sair?<input type="text" id="motivo" placeholder="Ex.: cansado, sem vontade de ver gente, chuva"></label>' : "", '\n    <label class="f">Anota\xE7\xE3o (opcional)<textarea id="nota" placeholder="O que aconteceu, onde estava, o que ajudou"></textarea></label>\n    <label class="f">Quando<input type="datetime-local" id="quando" value="').concat(toLocal(t), '"></label>\n    <div class="row2"><button class="btn pri" data-act="salvar">Salvar registro</button></div>\n  </div>\n  <p class="note" style="color:#9a9a96;text-align:center">Vers\xE3o 7 \xB7 build ').concat(window.BUILD || "local", "</p>");
}
function stats() {
  const ini = Date.now() - periodo * D;
  const ents = S.entries.filter((e) => e.t >= ini).sort((a, b) => a.t - b.t);
  const doses = S.doses.filter((d) => d.t >= ini).sort((a, b) => a.t - b.t);
  const por = {};
  for (const e of ents) for (const s of e.s) {
    const p = por[s.k] || (por[s.k] = { n: 0, soma: 0, rit: [] });
    p.n++;
    p.soma += s.n;
    const r = lastDoseBefore("rit", e.t);
    if (r && e.t - r.t < 24 * H) p.rit.push(e.t - r.t);
  }
  const lista = Object.entries(por).sort((a, b) => b[1].n - a[1].n);
  return { ini, ents, doses, lista };
}
function relHTML() {
  const { ents, doses, lista } = stats();
  const nd = (k) => doses.filter((d) => d.med === k);
  const media = (a) => a.length ? hs(a.reduce((x, y) => x + y, 0) / a.length) : "\u2014";
  const motivos = ents.filter((e) => e.motivo);
  return '<h1>Relat\xF3rio</h1>\n  <div class="seg">'.concat([7, 14, 30].map((p) => '<button class="'.concat(periodo === p ? "on" : "", '" data-per="').concat(p, '">').concat(p, " dias</button>")).join(""), '</div>\n  <div class="card"><h2>Rem\xE9dios no per\xEDodo</h2>\n    <table><tr><th>Rem\xE9dio</th><th class="n">Vezes</th><th class="n">Dias com dose</th></tr>\n    ').concat(["rit", "esc"].map((k) => {
    const l = nd(k);
    const dias = new Set(l.map((d) => fmtD(d.t))).size;
    return "<tr><td>".concat(MEDS[k], '</td><td class="n">').concat(l.length, '</td><td class="n">').concat(dias, " de ").concat(periodo, "</td></tr>");
  }).join(""), '</table></div>\n  <div class="card"><h2>Sintomas mais frequentes</h2>\n    ').concat(lista.length ? '<table><tr><th>Sintoma</th><th class="n">Vezes</th><th class="n">Intens.</th><th class="n">Ap\xF3s Ritalina</th></tr>\n    '.concat(lista.map(([k, p]) => "<tr><td>".concat(NOME[k], '</td><td class="n">').concat(p.n, '</td><td class="n">').concat((p.soma / p.n).toFixed(1).replace(".", ","), '</td><td class="n">').concat(media(p.rit), "</td></tr>")).join(""), '</table>\n    <p class="note">"Ap\xF3s Ritalina" = tempo m\xE9dio entre a \xFAltima dose e o registro (s\xF3 conta at\xE9 24 h).</p>') : '<p class="note">Nenhum registro neste per\xEDodo.</p>', "</div>\n  ").concat(motivos.length ? '<div class="card"><h2>Por que n\xE3o quis sair</h2>'.concat(motivos.map((e) => '<div class="entry"><div class="h">'.concat(fmt(e.t), '</div><div class="b">').concat(esc(e.motivo), "</div></div>")).join(""), "</div>") : "", '\n  <button class="btn pri full" data-act="compartilhar">Enviar relat\xF3rio (WhatsApp, e-mail\u2026)</button>');
}
function relTexto() {
  const { ini, ents, doses, lista } = stats();
  const L = [];
  L.push("DI\xC1RIO DE SINTOMAS: " + fmtD(ini) + " a " + fmtD(Date.now()));
  L.push("");
  L.push("REM\xC9DIOS");
  for (const k of ["rit", "esc"]) {
    const l = doses.filter((d) => d.med === k);
    L.push("- " + MEDS[k] + ": " + l.length + " dose(s), em " + new Set(l.map((d) => fmtD(d.t))).size + " de " + periodo + " dias");
  }
  L.push("");
  L.push("SINTOMAS (vezes | intensidade m\xE9dia 1-5 | tempo m\xE9dio ap\xF3s Ritalina)");
  if (!lista.length) L.push("- nenhum registro");
  for (const [k, p] of lista) {
    const m = p.rit.length ? hs(p.rit.reduce((x, y) => x + y, 0) / p.rit.length) : "-";
    L.push("- " + NOME[k] + ": " + p.n + "x | " + (p.soma / p.n).toFixed(1).replace(".", ",") + " | " + m);
  }
  const mot = ents.filter((e) => e.motivo);
  if (mot.length) {
    L.push("");
    L.push("POR QUE N\xC3O QUIS SAIR");
    mot.forEach((e) => L.push("- " + fmt(e.t) + ": " + e.motivo));
  }
  L.push("");
  L.push("REGISTROS");
  const tudo = [...ents.map((e) => ({ t: e.t, e })), ...doses.map((d) => ({ t: d.t, d }))].sort((a, b) => a.t - b.t);
  for (const x of tudo) {
    if (x.d) {
      L.push(fmt(x.t) + " | TOMOU " + MEDS[x.d.med] + (x.d.dose ? " " + x.d.dose : ""));
      continue;
    }
    const e = x.e, r = sinceTxt("rit", e.t);
    L.push(fmt(e.t) + (r ? " | Ritalina h\xE1 " + r : "") + " | " + e.s.map((s) => NOME[s.k] + " " + s.n).join(", ") + (e.nota ? " | " + e.nota : ""));
  }
  return L.join("\n");
}
async function compartilhar() {
  const text = relTexto();
  const Sh = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
  try {
    if (Sh) {
      await Sh.share({ title: "Di\xE1rio de sintomas", text });
      return;
    }
    if (navigator.share) {
      await navigator.share({ title: "Di\xE1rio de sintomas", text });
      return;
    }
  } catch (e) {
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("Relat\xF3rio copiado");
  } catch (e) {
    toast("N\xE3o foi poss\xEDvel compartilhar");
  }
}
function histHTML() {
  const tudo = [...S.entries.map((e) => ({ t: e.t, e })), ...S.doses.map((d) => ({ t: d.t, d }))].sort((a, b) => b.t - a.t).slice(0, 200);
  return '<h1>Hist\xF3rico</h1><div class="card">'.concat(tudo.length ? tudo.map((x) => {
    if (x.d) return '<div class="entry"><div class="h"><span>'.concat(fmt(x.t), '<span class="tag med">').concat(MEDS[x.d.med], " ").concat(esc(x.d.dose || ""), '</span></span>\n      <button class="btn del" data-deld="').concat(x.d.id, '">Excluir</button></div></div>');
    const e = x.e, r = sinceTxt("rit", e.t);
    return '<div class="entry"><div class="h"><span>'.concat(fmt(e.t)).concat(r ? '<span class="tag">Ritalina h\xE1 '.concat(r, "</span>") : "", '</span>\n      <button class="btn del" data-dele="').concat(e.id, '">Excluir</button></div>\n      <div class="b">').concat(e.s.map((s) => esc(NOME[s.k]) + " " + s.n).join(", ")).concat(e.motivo ? "<br><i>N\xE3o quis sair: " + esc(e.motivo) + "</i>" : "").concat(e.nota ? "<br>" + esc(e.nota) : "", "</div></div>");
  }).join("") : '<p class="note">Nenhum registro ainda. Comece em Registrar.</p>', "</div>");
}
const LN = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins.LocalNotifications : null;
function lembResumo() {
  const r = ["rit", "esc"].filter((k) => S.lemb[k].length).map((k) => MEDS[k] + " " + S.lemb[k].join(", "));
  return r.length ? r.join(" \xB7 ") : "nenhum";
}
function abrirLembretes() {
  const bloco = (k) => '<div class="grp"><h3>'.concat(MEDS[k], '</h3><div id="l-').concat(k, '" style="display:grid;gap:6px">\n      ').concat(S.lemb[k].map((h) => '<div class="selrow"><input type="time" value="'.concat(h, '" class="lt" data-med="').concat(k, '"><button class="btn del" data-rmh="1">Remover</button></div>')).join(""), '</div>\n      <button class="btn" style="margin-top:6px" data-addh="').concat(k, '">+ Hor\xE1rio</button></div>');
  $("sheetIn").innerHTML = '<h2>Lembretes de rem\xE9dio</h2>\n    <p class="note">Toca todo dia no hor\xE1rio escolhido. Tocar na notifica\xE7\xE3o abre o registro da dose.</p>\n    '.concat(bloco("rit")).concat(bloco("esc"), "\n    ").concat(LN ? "" : '<p class="note">Os lembretes s\xF3 tocam no app instalado no Android.</p>', '\n    <p class="note" id="exato"></p>\n    <div class="row2"><button class="btn ghost" data-act="fechar">Cancelar</button><button class="btn" data-act="testelemb">Testar</button><button class="btn pri" data-act="salvarlemb">Salvar</button></div>');
  $("sheet").classList.add("show");
}
async function agendarLembretes() {
  if (!LN) return;
  try {
    await LN.requestPermissions();
    try {
      await LN.createChannel({ id: "remedios", name: "Lembretes de rem\xE9dio", importance: 5, visibility: 1, vibration: true });
    } catch (e) {
    }
    const p = await LN.getPending();
    const velhos = p.notifications.filter((n) => n.id >= 1e3 && n.id < 3e3);
    if (velhos.length) await LN.cancel({ notifications: velhos.map((n) => ({ id: n.id })) });
    const lista = [];
    ["rit", "esc"].forEach((k, j) => S.lemb[k].forEach((h, i) => {
      const [hour, minute] = h.split(":").map(Number);
      lista.push({
        id: 1e3 + j * 1e3 + i,
        title: "Hora do " + (k === "rit" ? "Ritalina" : "Escitalopram"),
        body: "Toque para registrar que tomou.",
        channelId: "remedios",
        schedule: { on: { hour, minute }, allowWhileIdle: true },
        extra: { med: k }
      });
    }));
    if (lista.length) await LN.schedule({ notifications: lista });
